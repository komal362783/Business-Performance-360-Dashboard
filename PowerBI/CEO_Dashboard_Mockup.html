<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Business Performance 360° Dashboard — GlobalMart Retail Inc.</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --navy:#1F3864; --navy-light:#2E5395; --gold:#C9A961; --green:#2E7D32;
  --red:#C62828; --grey:#595959; --bg:#F5F6F8; --panel:#FFFFFF; --border:#E4E7EC;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:'Segoe UI',-apple-system,'Inter',sans-serif; background:var(--bg); color:#1a1a1a;}
.app{display:flex; min-height:100vh;}

/* NAV RAIL */
.navrail{width:210px; background:var(--navy); color:#fff; display:flex; flex-direction:column; flex-shrink:0; position:sticky; top:0; height:100vh;}
.navrail .brand{padding:22px 18px 16px; border-bottom:1px solid rgba(255,255,255,0.12);}
.navrail .brand .title{font-weight:700; font-size:15px; letter-spacing:0.3px;}
.navrail .brand .sub{font-size:11px; color:#C9D3E6; margin-top:3px;}
.navrail nav{flex:1; padding:10px 0; overflow-y:auto;}
.navbtn{display:flex; align-items:center; gap:10px; width:100%; background:none; border:none; color:#D7DEEC;
  padding:11px 18px; font-size:13px; text-align:left; cursor:pointer; border-left:3px solid transparent;}
.navbtn:hover{background:rgba(255,255,255,0.06); color:#fff;}
.navbtn.active{background:rgba(255,255,255,0.10); color:#fff; border-left:3px solid var(--gold); font-weight:600;}
.navbtn .ic{width:18px; text-align:center; font-size:14px;}
.navrail .foot{padding:14px 18px; font-size:10.5px; color:#9FB0CC; border-top:1px solid rgba(255,255,255,0.12);}

/* MAIN */
.main{flex:1; min-width:0;}
.page{display:none; padding:22px 26px 40px;}
.page.active{display:block;}
.pagehead{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:16px; flex-wrap:wrap; gap:10px;}
.pagehead h1{font-size:21px; color:var(--navy); font-weight:700;}
.pagehead .desc{font-size:12.5px; color:var(--grey); margin-top:3px;}
.slicers{display:flex; gap:8px; flex-wrap:wrap;}
.slicer{background:#fff; border:1px solid var(--border); border-radius:6px; padding:7px 12px; font-size:12px; color:var(--navy); font-weight:600; cursor:pointer;}
.slicer.active{background:var(--navy); color:#fff; border-color:var(--navy);}

/* KPI CARDS */
.kpirow{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px; margin-bottom:18px;}
.kpi{background:var(--panel); border-radius:8px; padding:14px 16px; border:1px solid var(--border); border-top:3px solid var(--navy);}
.kpi.gold{border-top-color:var(--gold);} .kpi.green{border-top-color:var(--green);} .kpi.red{border-top-color:var(--red);}
.kpi .label{font-size:10.5px; color:var(--grey); text-transform:uppercase; letter-spacing:0.4px; font-weight:600;}
.kpi .value{font-size:22px; font-weight:700; color:var(--navy); margin-top:4px;}
.kpi .delta{font-size:11px; margin-top:3px; font-weight:600;}
.kpi .delta.up{color:var(--green);} .kpi .delta.down{color:var(--red);}

/* GRID / PANELS */
.grid{display:grid; gap:14px;}
.g2{grid-template-columns:2fr 1fr;} .g3{grid-template-columns:1fr 1fr 1fr;}
.g12{grid-template-columns:1fr 1fr;}
.panel{background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:16px;}
.panel h3{font-size:13px; color:var(--navy); margin-bottom:10px; font-weight:700;}
.panel .note{font-size:10.5px; color:var(--grey); margin-top:8px; font-style:italic;}
.chartwrap{position:relative; height:260px;}
.chartwrap.tall{height:340px;}
.chartwrap.short{height:190px;}

table{width:100%; border-collapse:collapse; font-size:12px;}
th{text-align:left; color:var(--grey); font-weight:600; padding:6px 8px; border-bottom:2px solid var(--border); font-size:10.5px; text-transform:uppercase;}
td{padding:7px 8px; border-bottom:1px solid var(--border);}
tr:hover td{background:#FAFBFC;}
.bar-cell{background:linear-gradient(90deg, var(--navy-light) var(--pct,0%), transparent var(--pct,0%)); }
.tag{display:inline-block; padding:2px 8px; border-radius:10px; font-size:10px; font-weight:700;}
.tag.on{background:#E3F1E3; color:var(--green);} .tag.off{background:#FBE3E3; color:var(--red);}

.badge{display:inline-flex; align-items:center; gap:5px; background:#EEF2F9; color:var(--navy); font-size:10.5px; font-weight:600; padding:4px 10px; border-radius:12px;}
.callout{background:#FFF8E8; border:1px solid #F0E0B0; border-radius:6px; padding:10px 12px; font-size:11.5px; color:#6B5A20; margin-top:10px;}
.bookmarkbar{display:flex; gap:8px; margin-bottom:14px;}
.bookmark{background:#fff; border:1px solid var(--gold); color:var(--navy); font-size:11.5px; font-weight:600; padding:6px 12px; border-radius:16px; cursor:pointer;}
.bookmark:hover{background:var(--gold); color:#fff;}

@media (max-width: 900px){
  .navrail{width:64px;} .navrail .brand .sub, .navbtn span.label{display:none;}
  .navrail .brand .title{font-size:10px;} .navbtn{justify-content:center; padding:12px 6px;}
  .g2,.g3,.g12{grid-template-columns:1fr;}
  .kpirow{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>

<script>
// ============================================================================
// Business Performance 360 Dashboard - Mockup Logic
// ============================================================================
const DATA = JSON.parse(document.getElementById('dashdata').textContent);
const K = DATA.kpis;

const COLORS = {navy:'#1F3864', navyLight:'#2E5395', gold:'#C9A961', green:'#2E7D32', red:'#C62828', grey:'#8A93A6'};
const PALETTE = [COLORS.navy, COLORS.gold, COLORS.green, COLORS.red, COLORS.navyLight, '#7B9ACC', '#E0B96B', '#5C7A5D'];

Chart.defaults.font.family = "'Segoe UI', sans-serif";
Chart.defaults.font.size = 11;
Chart.defaults.color = '#4A5568';
Chart.defaults.plugins.legend.labels.usePointStyle = true;

function fmtMoney(v, compact=true){
  if (compact){
    if (Math.abs(v) >= 1e6) return '$' + (v/1e6).toFixed(1) + 'M';
    if (Math.abs(v) >= 1e3) return '$' + (v/1e3).toFixed(0) + 'K';
  }
  return '$' + v.toLocaleString(undefined, {maximumFractionDigits:0});
}
function fmtNum(v){ return v.toLocaleString(); }
function fmtPct(v){ return v.toFixed(1) + '%'; }

// ============================================================================
// PAGE DEFINITIONS
// ============================================================================
const PAGES = [
  {id:'exec', icon:'&#9776;', label:'Executive Overview'},
  {id:'sales', icon:'&#128179;', label:'Sales Analysis'},
  {id:'customer', icon:'&#128100;', label:'Customer Analysis'},
  {id:'product', icon:'&#128230;', label:'Product Analysis'},
  {id:'regional', icon:'&#127760;', label:'Regional Analysis'},
  {id:'profit', icon:'&#128200;', label:'Profit Analysis'},
  {id:'returns', icon:'&#8634;', label:'Returns Dashboard'},
  {id:'forecast', icon:'&#128302;', label:'Forecast Dashboard'},
];

// Build nav rail
const navmenu = document.getElementById('navmenu');
PAGES.forEach((p,i) => {
  const btn = document.createElement('button');
  btn.className = 'navbtn' + (i===0 ? ' active' : '');
  btn.id = 'nav-' + p.id;
  btn.innerHTML = `<span class="ic">${p.icon}</span><span class="label">${p.label}</span>`;
  btn.onclick = () => showPage(p.id);
  navmenu.appendChild(btn);
});

function showPage(id){
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.navbtn').forEach(el => el.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  document.getElementById('nav-' + id).classList.add('active');
}

// ============================================================================
// KPI CARD HELPER
// ============================================================================
function kpiCard(label, value, cls='', delta=null){
  const deltaHtml = delta ? `<div class="delta ${delta.dir}">${delta.dir==='up'?'&#9650;':'&#9660;'} ${delta.text}</div>` : '';
  return `<div class="kpi ${cls}"><div class="label">${label}</div><div class="value">${value}</div>${deltaHtml}</div>`;
}

  <div class="pagehead">

  </div>
  <div class="kpirow">

    ${kpiCard('Refund % of Revenue', fmtPct(K.refund_pct_of_revenue), 'red')}
    ${kpiCard('Total Returns', fmtNum(6108))}
  </div>
  <div class="grid g2">
    <div class="panel"><h3>Return Reason Breakdown</h3><div class="chartwrap tall"><canvas id="c-ret-reason"></canvas></div></div>
    <div class="panel"><h3>Return Rate % by Category</h3><div class="chartwrap tall"><canvas id="c-ret-cat"></canvas></div></div>
  </div>
</div>

<!-- PAGE 8: FORECAST DASHBOARD -->
<div class="page" id="page-forecast">
  <div class="pagehead">
    <div><h1>Forecast Dashboard</h1><div class="desc">Forward-looking view for planning conversations</div></div>
  </div>
  <div class="kpirow">
    ${kpiCard('Latest MoM Growth', fmtPct(K.mom_growth_pct_latest), 'green')}
    ${kpiCard('YoY Growth (Jan-Jul)', fmtPct(K.yoy_growth_pct_jan_jul), 'green')}
    ${kpiCard('Forecast Basis', 'Through ' + K.analysis_complete_through, 'gold')}
  </div>
  <div class="panel" style="margin-bottom:14px;"><h3>Revenue Forecast (next 3 months, illustrative)</h3><div class="chartwrap tall"><canvas id="c-forecast"></canvas></div>
    <div class="note">Forecast uses a simple trend projection from the complete reporting window for this mockup. The live Power BI page uses the native Analytics Pane forecast with a confidence interval, plus a What-If growth-rate parameter (see Build Guide Section 11).</div></div>
  <div class="panel"><h3>Scenario Table &mdash; Next Month Revenue at Different Growth Assumptions</h3><table id="t-forecast-scenarios"></table></div>
</div>

`;

// ============================================================================
// CHART RENDERING
// ============================================================================
function barChart(id, labels, values, color=COLORS.navy, horizontal=false, moneyAxis=true){
  new Chart(document.getElementById(id), {
    type:'bar',
    data:{labels, datasets:[{data:values, backgroundColor:color, borderRadius:3, maxBarThickness:28}]},
    options:{
      indexAxis: horizontal ? 'y' : 'x',
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}, tooltip:{callbacks:{label:(ctx)=> moneyAxis ? fmtMoney(ctx.raw,false) : ctx.raw}}},
      scales:{
        x:{ticks:{callback:(v)=> horizontal ? (moneyAxis?fmtMoney(v):v) : (moneyAxis?fmtMoney(v):v)}, grid:{display:!horizontal}},
        y:{ticks:{callback:(v,i)=> horizontal ? labels[i] : (moneyAxis?fmtMoney(v):v)}, grid:{display:horizontal}}
      }
    }
  });
}

function groupedBar(id, labels, series){ // series = [{label,data,color}]
  new Chart(document.getElementById(id), {
    type:'bar',
    data:{labels, datasets: series.map(s=>({label:s.label, data:s.data, backgroundColor:s.color, borderRadius:3}))},
    options:{responsive:true, maintainAspectRatio:false,
      plugins:{legend:{position:'bottom'}},
      scales:{y:{ticks:{callback:(v)=>fmtMoney(v)}}}}
  });
}

function lineChart(id, labels, values, color=COLORS.navy){
  new Chart(document.getElementById(id), {
    type:'line',
    data:{labels, datasets:[{data:values, borderColor:color, backgroundColor:color+'22', fill:true, tension:0.35, pointRadius:0, borderWidth:2.5}]},
    options:{responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{y:{ticks:{callback:(v)=>fmtMoney(v)}}, x:{ticks:{maxRotation:45, minRotation:45, autoSkip:true, maxTicksLimit:12}}}}
  });
}

function donutChart(id, labels, values){
  new Chart(document.getElementById(id), {
    type:'doughnut',
    data:{labels, datasets:[{data:values, backgroundColor:PALETTE, borderWidth:2, borderColor:'#fff'}]},
    options:{responsive:true, maintainAspectRatio:false, cutout:'62%',
      plugins:{legend:{position:'right', labels:{boxWidth:10, font:{size:10.5}}},
        tooltip:{callbacks:{label:(ctx)=> ctx.label + ': ' + fmtMoney(ctx.raw)}}}}
  });
}

function gaugeChart(id, pct){
  const clamped = Math.min(pct, 150);
  new Chart(document.getElementById(id), {
    type:'doughnut',
    data:{labels:['Achieved','Remaining'], datasets:[{data:[clamped, Math.max(150-clamped,0)], backgroundColor:[COLORS.green, '#E4E7EC'], borderWidth:0}]},
    options:{responsive:true, maintainAspectRatio:false, cutout:'75%', rotation:-90, circumference:180,
      plugins:{legend:{display:false}, tooltip:{enabled:false}}}
  });
}

// Page 1: Executive Overview
lineChart('c-exec-trend', DATA.monthly_revenue.labels, DATA.monthly_revenue.values);
donutChart('c-exec-cat', DATA.category.labels, DATA.category.revenue);
barChart('c-exec-region', DATA.country.labels.slice(0,5), DATA.country.values.slice(0,5), COLORS.navy, true);
gaugeChart('c-exec-gauge', K.avg_target_achievement_pct);

// Page 2: Sales Analysis
donutChart('c-sales-channel', DATA.channel.labels, DATA.channel.values);
barChart('c-sales-country', DATA.country.labels, DATA.country.values, COLORS.navyLight);
(function(){
  const tbl = document.getElementById('t-sales-reps');
  const max = Math.max(...DATA.top_reps.values);
  let html = '<tr><th>Rank</th><th>Sales Rep</th><th>Revenue</th><th></th></tr>';
  DATA.top_reps.labels.forEach((name,i)=>{
    const v = DATA.top_reps.values[i]; const pct = (v/max*100).toFixed(0);
    html += `<tr><td>#${i+1}</td><td>${name}</td><td>${fmtMoney(v)}</td><td style="width:120px;"><div class="bar-cell" style="--pct:${pct}%; height:14px; border-radius:3px;"></div></td></tr>`;
  });
  tbl.innerHTML = html;
})();

// Page 3: Customer Analysis
donutChart('c-cust-segment', DATA.segment.labels, DATA.segment.values);
barChart('c-cust-top', DATA.top_customers.labels, DATA.top_customers.values, COLORS.gold, true);

// Page 4: Product Analysis
barChart('c-prod-top', DATA.top_products.labels, DATA.top_products.values, COLORS.navy, true);
barChart('c-prod-bottom', DATA.bottom_products.labels, DATA.bottom_products.values, COLORS.red, true);
groupedBar('c-prod-cat', DATA.category.labels, [
  {label:'Revenue', data:DATA.category.revenue, color:COLORS.navy},
  {label:'Profit', data:DATA.category.profit, color:COLORS.gold},
]);

// Page 5: Regional Analysis
barChart('c-reg-top', DATA.target_top.labels, DATA.target_top.values, COLORS.green, true, false);
barChart('c-reg-bottom', DATA.target_bottom.labels, DATA.target_bottom.values, COLORS.red, true, false);

// Page 6: Profit Analysis
barChart('c-profit-dist', DATA.margin_dist.labels, DATA.margin_dist.values, COLORS.navyLight, false, false);
groupedBar('c-profit-cat', DATA.category.labels, [
  {label:'Revenue', data:DATA.category.revenue, color:COLORS.navy},
  {label:'Profit', data:DATA.category.profit, color:COLORS.gold},
]);

// Page 7: Returns Dashboard
barChart('c-ret-reason', DATA.return_reason.labels, DATA.return_reason.values, COLORS.red, true, false);
barChart('c-ret-cat', DATA.return_by_category.labels, DATA.return_by_category.values, COLORS.red, true, false);

// Page 8: Forecast Dashboard
(function(){
  const hist = DATA.monthly_revenue;
  const lastN = hist.values.slice(-6);
  const avgGrowth = lastN.slice(1).map((v,i)=> (v-lastN[i])/lastN[i]).reduce((a,b)=>a+b,0) / (lastN.length-1);
  const lastVal = hist.values[hist.values.length-1];
  const forecastVals = []; let v = lastVal;
  for(let i=0;i<3;i++){ v = v*(1+avgGrowth); forecastVals.push(Math.round(v)); }
  const labels = [...hist.labels, 'F+1', 'F+2', 'F+3'];
  const actual = [...hist.values, null, null, null];
  const forecast = [...Array(hist.values.length-1).fill(null), lastVal, ...forecastVals];

  new Chart(document.getElementById('c-forecast'), {
    type:'line',
    data:{labels, datasets:[
      {label:'Actual', data:actual, borderColor:COLORS.navy, backgroundColor:COLORS.navy+'22', fill:true, tension:0.3, pointRadius:0, borderWidth:2.5},
      {label:'Forecast', data:forecast, borderColor:COLORS.gold, borderDash:[6,4], fill:false, tension:0.3, pointRadius:3, borderWidth:2.5},
    ]},
    options:{responsive:true, maintainAspectRatio:false,
      plugins:{legend:{position:'bottom'}},
      scales:{y:{ticks:{callback:(v)=>fmtMoney(v)}}, x:{ticks:{maxRotation:45, minRotation:45, autoSkip:true, maxTicksLimit:14}}}}
  });

  const tbl = document.getElementById('t-forecast-scenarios');
  let html = '<tr><th>Growth Assumption</th><th>Forecasted Next-Month Revenue</th></tr>';
  [0, 0.05, 0.10, 0.15].forEach(g=>{
    html += `<tr><td>${(g*100).toFixed(0)}%</td><td>${fmtMoney(lastVal*(1+g))}</td></tr>`;
  });
  tbl.innerHTML = html;
})();

</script>
</body>
</html>
